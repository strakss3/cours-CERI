<!DOCTYPE HTML>
<HTML>
<HEAD>
	<title>TP 5 Ethan Bernon</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="http://www.w3schools.com/lib/w3.css">
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
	<link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-teal.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css">
</HEAD>
<BODY>
	<header class="w3-header w3-theme w3-center w3-padding">
		<h1>Bienvenue dans le site</h1>
	</header>
	<main class="w3-card w3-content w3-margin-top w3-margin-bottom">
		<div class="w3-container w3-theme w3-margin-bottom">
			<h2>Formulaire d'inscription</h2>	
		</div>
		<form method="get" class="w3-container">
			<label for="prenom" class="w3-text-theme">Prenom<span class="w3-text-grey">*</span> :</label><br>
			<input class="w3-input" type="text" name="prenom" id="prenom" required>
			<br>
			<label for="nom" class="w3-text-theme">Nom<span class="w3-text-grey">*</span> :</label><br>
			<input class="w3-input" type="text" name="nom" id="nom" required>
			<br>
			<label for="age" class="w3-text-theme">Age :</label><br>
			<input class="w3-input" type="number" name="age" id="age" min="1" max="100">
			<br><br>
			
			<details>
				<summary class="w3-text-theme">Genre :</summary>
				
				<input type="radio" name="genre" id="homme">
				<label for="homme" >Homme</label>
				<br>
				<input type="radio" name="genre" id="femme">
				<label for="femme">Femme</label>
				<br>
				<input type="radio" name="genre" id="autre">
				<label for="autre">Autre</label>
			</details><br>
			
			<details class="w3-margin-bottom">
				<summary class="w3-text-theme">Pratiques sportives :</summary>
				
				<div class="w3-half">
					<input type="checkbox" name="sport1" id="sport1">
					<label for="sport1">Bossaball</label>
					<br>
					<input type="checkbox" name="sport2" id="sport2">
					<label for="sport2">Chessboxing</label>
					<br>
					<input type="checkbox" name="sport3" id="sport3">
					<label for="sport3">Kabaddi</label>
				</div>
				<div>
					<input type="checkbox" name="sport4" id="sport4">
					<label for="sport4">Quidditch Moldu</label>
					<br>
					<input type="checkbox" name="sport5" id="sport5">
					<label for="sport5">Bubble Football</label>
					<br>
					<input type="checkbox" name="sport6" id="sport6">
					<label for="sport6">Hurling</label>
					<br>
					<input type="checkbox" name="sport7" id="sport7" disabled>
					<label for="sport7">Autre</label>
				</div>
			</details>
			
			<label class="w3-text-theme">Activité principale :</label><br>
			<select class="w3-select">
				<option value="activite1">Etudiant</option>
				<option value="activite2" selected>Travailleur</option>
				<option value="activite3">Retraité</option>
				<option value="activite4">Sans Emploi</option>
			</select><br><br>
			
			<label class="w3-text-theme">Moyens de transports :</label><br>
			<select class="w3-select" multiple size="6">		
				<option value="transport1">Concorde</option>
				<option value="transport2" selected>Brouette</option>
				<option value="transport3">DeLorean</option>
				<option value="transport4">Cloche pied</option>
				<option value="transport5">TARDIS</option>
				<option value="transport6">Nimbus 2000</option>
			</select><br><br><br>
			
			<label for="email" class="w3-text-theme">Email :</label><br>
			<input class="w3-input" type="email" name="email" placeholder="prenom.nom@univ-avignon.fr" id="email">
			<br>
			<label for="mdp1" class="w3-text-theme">Mot de passe :</label><br>
			<input class="w3-input" type="password" name="mpd1" id="mdp1">
			<br>
			<label for="mdp2" class="w3-text-theme">Confirmation du mot de passe :</label><br>
			<input class="w3-input" type="password" name="mpd2" id="mdp2">
			<br><br>
			
			<label for="info" class="w3-text-theme">Autres informations :</label><br>
			<textarea class="w3-input" name="info" id="info" row="3"></textarea>
			<br><br>
			<input class="w3-button w3-theme w3-round w3-margin-bottom" type="submit">
			<input class="w3-button w3-theme w3-round w3-margin-bottom" type="reset">
		</form>
	</main>
</BODY>
</HTML>
